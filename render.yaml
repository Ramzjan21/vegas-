services:
  - type: web
    name: vegas-cafe-backend
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm install && npm run build:render
    startCommand: npm run start:render
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: vegas-cafe-db
          property: connectionString

databases:
  - name: vegas-cafe-db
    plan: free
    region: frankfurt
    databaseName: vegas_cafe
    user: vegas_admin
